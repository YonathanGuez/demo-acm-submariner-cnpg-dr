{{- if eq .Values.replication.role "primary" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ocp-database
  namespace: {{ .Values.namespace }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  instances: {{ .Values.database.instances }}
  storage:
    size: 1Gi
    
  bootstrap:
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.credentials.username }}
      secret:
        name: app-secret
      postInitApplicationSQLRefs:
        configMapRefs:
        - name: configmap-db
          key: configmap.sql
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio-storage
  externalClusters:
  - name: source
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: minio-storage
        serverName: ocp-database
{{- end }}
