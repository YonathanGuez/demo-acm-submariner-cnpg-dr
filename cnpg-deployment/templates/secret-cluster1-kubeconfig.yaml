{{- if and (eq .Values.replication.role "replica") .Values.replica.certBridge.enabled .Values.replica.certBridge.cluster1Kubeconfig }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.replica.certBridge.cluster1KubeconfigSecret }}
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
type: Opaque
stringData:
  config: {{ .Values.replica.certBridge.cluster1Kubeconfig | quote }}
{{- end }}
