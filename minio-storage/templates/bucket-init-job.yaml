apiVersion: v1
kind: ServiceAccount
metadata:
  name: bucket-init
  namespace: {{ .Values.namespace }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bucket-init
  namespace: {{ .Values.namespace }}
  {{- with .Values.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: bucket-init
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.commonAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: bucket-init
      containers:
      - name: init
        image: quay.io/minio/mc:latest
        command:
        - /bin/bash
        - /scripts/create-buckets.sh
        env:
        - name: MINIO_SERVICE_URL
          value: "http://minio-service.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.service.apiPort }}"
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: minio_root_user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: minio_root_password
        - name: MINIO_BUCKETS
          value: "{{ join "," .Values.buckets }}"
        volumeMounts:
        - name: init-script
          mountPath: /scripts
      volumes:
      - name: init-script
        configMap:
          name: minio-bucket-config
          defaultMode: 0755
      restartPolicy: OnFailure
