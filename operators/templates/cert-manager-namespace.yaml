{{- if .Values.certManager.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.certManager.namespace }}
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/component: cert-manager
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
{{- end }}
