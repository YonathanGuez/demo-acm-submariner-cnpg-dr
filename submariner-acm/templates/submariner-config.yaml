{{- if and .Values.submariner.enabled .Values.clusters.cluster1.enabled }}
apiVersion: addon.open-cluster-management.io/v1alpha1
kind: ManagedClusterAddOn
metadata:
  name: submariner
  namespace: {{ .Values.clusters.cluster1.name }}
spec:
  installNamespace: submariner-operator
---
apiVersion: submarineraddon.open-cluster-management.io/v1alpha1
kind: SubmarinerConfig
metadata:
  name: submariner
  namespace: {{ .Values.clusters.cluster1.name }}
spec:
  gatewayConfig:
    gateways: 1
    aws:
      instanceType: {{ .Values.clusters.cluster1.awsInstanceType | quote }}
  IPSecIKEPort: {{ .Values.submariner.IPSecIKEPort }}
  IPSecNATTPort: {{ .Values.submariner.IPSecNATTPort }}
  airGappedDeployment: {{ .Values.submariner.airGappedDeployment }}
  NATTEnable: {{ .Values.submariner.NATTEnable }}
  loadBalancerEnable: {{ .Values.submariner.loadBalancerEnable }}
  cableDriver: {{ .Values.submariner.cableDriver }}
  globalCIDR: ""
  credentialsSecret:
    name: {{ .Values.clusters.cluster1.name }}-aws-creds
  subscriptionConfig:
    source: {{ .Values.submariner.subscriptionConfig.source }}
    sourceNamespace: {{ .Values.submariner.subscriptionConfig.sourceNamespace }}
    channel: {{ .Values.submariner.subscriptionConfig.channel }}
    startingCSV: ""
    installPlanApproval: {{ .Values.submariner.subscriptionConfig.installPlanApproval }}
---
{{- end }}
{{- if and .Values.submariner.enabled .Values.clusters.cluster2.enabled }}
apiVersion: addon.open-cluster-management.io/v1alpha1
kind: ManagedClusterAddOn
metadata:
  name: submariner
  namespace: {{ .Values.clusters.cluster2.name }}
spec:
  installNamespace: submariner-operator
---
apiVersion: submarineraddon.open-cluster-management.io/v1alpha1
kind: SubmarinerConfig
metadata:
  name: submariner
  namespace: {{ .Values.clusters.cluster2.name }}
spec:
  gatewayConfig:
    gateways: 1
    aws:
      instanceType: {{ .Values.clusters.cluster2.awsInstanceType | quote }}
  IPSecIKEPort: {{ .Values.submariner.IPSecIKEPort }}
  IPSecNATTPort: {{ .Values.submariner.IPSecNATTPort }}
  airGappedDeployment: {{ .Values.submariner.airGappedDeployment }}
  NATTEnable: {{ .Values.submariner.NATTEnable }}
  loadBalancerEnable: {{ .Values.submariner.loadBalancerEnable }}
  cableDriver: {{ .Values.submariner.cableDriver }}
  globalCIDR: ""
  credentialsSecret:
    name: {{ .Values.clusters.cluster2.name }}-aws-creds
  subscriptionConfig:
    source: {{ .Values.submariner.subscriptionConfig.source }}
    sourceNamespace: {{ .Values.submariner.subscriptionConfig.sourceNamespace }}
    channel: {{ .Values.submariner.subscriptionConfig.channel }}
    startingCSV: ""
    installPlanApproval: {{ .Values.submariner.subscriptionConfig.installPlanApproval }}
---
{{- end }}
{{- if .Values.submariner.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.clusterSet.name }}-broker
---
apiVersion: submariner.io/v1alpha1
kind: Broker
metadata:
  name: submariner-broker
  namespace: {{ .Values.clusterSet.name }}-broker
  labels:
    cluster.open-cluster-management.io/backup: submariner
spec:
  globalnetEnabled: false
  globalnetCIDRRange: ""
---
{{- end }}
